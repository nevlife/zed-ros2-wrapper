# Parameter override applied by zedonex_multi_camera.launch.py

/**:
    ros__parameters:
        general:
            pub_resolution: "NATIVE" # general.raw_nv12 publishes the sensor-resolution ISP buffer
            raw_nv12: false
        flux:
            enable: true
            backend: "flux2"
            device: "cuda"
            slot_count: 8
